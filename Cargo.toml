[package]
name = "mandelbrot-wp"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.4"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
color_space = "0.5.4"
dirs = "6.0.0"
image_crate = { package = "image", version = "0.25.10", default-features = false, features = ["png"] }
num = { version = "0.4.3", features = ["serde"] }
rand = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
